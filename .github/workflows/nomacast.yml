name: Metrolist N

# Builds "Metrolist N" (package com.metrolist.music.n): upstream Metrolist's latest
# release + the Nomacast patch (DownloadExporter). Runs on every push to the `n` branch,
# and once a day to pick up new upstream releases automatically (published only when
# something changed). The APK goes to this repo's Releases as MetrolistN.apk.

on:
  push:
    branches: ['n']
    paths-ignore: ['**.md']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrolist-n
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: n
          fetch-depth: 0

      - name: Merge the latest upstream release
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          UP=$(git ls-remote --tags https://github.com/MetrolistGroup/Metrolist.git \
            | grep -v '\^{}' | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          TAG="n-${UP}-$(git rev-parse --short HEAD)"
          echo "upstream=$UP tag=$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Already built: $TAG"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch -q https://github.com/MetrolistGroup/Metrolist.git "refs/tags/$UP:refs/tags/$UP"
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit "$UP" || {
            # Upstream workflow edits are irrelevant here; any other conflict needs a human.
            git diff --name-only --diff-filter=U | grep '^\.github/' | xargs -r git checkout --theirs --
            git diff --name-only --diff-filter=U | grep '^\.github/' | xargs -r git add
            git -c user.name=ci -c user.email=ci@localhost commit --no-edit
          }

      - uses: actions/setup-java@v5
        if: steps.up.outputs.skip != 'true'
        with:
          distribution: 'temurin'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        if: steps.up.outputs.skip != 'true'

      - name: Build
        if: steps.up.outputs.skip != 'true'
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music.n
          METROLIST_APP_NAME: Metrolist N
        run: ./gradlew --console=plain assembleIzzyRelease

      - name: Sign
        if: steps.up.outputs.skip != 'true'
        run: |
          set -e
          . nomacast/signing.properties
          APK=$(find app/build/outputs/apk/izzy/release -name '*.apk' | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          "$BT/zipalign" -f -p 4 "$APK" out/aligned.apk
          "$BT/apksigner" sign --ks "$storeFile" --ks-pass "pass:$storePassword" \
            --ks-key-alias "$keyAlias" --key-pass "pass:$keyPassword" \
            --out out/MetrolistN.apk out/aligned.apk
          "$BT/apksigner" verify out/MetrolistN.apk

      - name: Publish
        if: steps.up.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.up.outputs.tag }}" out/MetrolistN.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Metrolist N ${{ steps.up.outputs.tag }}" \
            --notes "Metrolist ${{ steps.up.outputs.tag }} + export automatique des téléchargements vers Music/Metrolist." \
            --latest
